name: Instagram — Promoção Festa do Peão Post 3 (14/08 11h)
on:
  schedule:
    - cron: '0 14 14 8 *'  # 14h UTC = 11h BRT
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Publicar Feed + Story no Instagram
        env:
          SOCIAL_INSTAGRAM_2_LABEL: colchoes_e_cia
          SOCIAL_INSTAGRAM_2_ACCOUNT_ID: "17841400910282540"
          SOCIAL_INSTAGRAM_2_PAGE_TOKEN: ${{ secrets.INSTAGRAM_COLCHOES_TOKEN }}
        run: python3 "marketing/conteudo/festa-peao-promocao-2026-08/post-03-ultimos-dias/post_social.py"
