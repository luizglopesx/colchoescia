name: Instagram — Festa do Peão D33 Light Casal (05/08 12h15)
on:
  schedule:
    - cron: '15 15 5 8 *'  # 15h15 UTC = 12h15 BRT
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Publicar Feed + Story no Instagram
        env:
          SOCIAL_INSTAGRAM_2_LABEL: colchoes_e_cia
          SOCIAL_INSTAGRAM_2_ACCOUNT_ID: "17841400910282540"
          SOCIAL_INSTAGRAM_2_PAGE_TOKEN: ${{ secrets.INSTAGRAM_COLCHOES_TOKEN }}
        run: python3 "marketing/campanhas/2026-08-festa-do-peao/Artes e Planejamento/Planejamento/post_instagram_d33_light_casal.py"
