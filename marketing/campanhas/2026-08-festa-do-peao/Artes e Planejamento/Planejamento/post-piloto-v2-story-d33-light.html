<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body { background: #20140c; font-family: Arial, sans-serif; }

  .story {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
    background: #c7a06b url("bg-piloto-v2-story-sem-produtos.png") center / cover no-repeat;
  }

  .vignette {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 47%, transparent 42%, rgba(43, 20, 6, .24) 100%),
      linear-gradient(to bottom, rgba(255, 239, 202, .04), rgba(48, 20, 5, .16));
  }

  .logo-board {
    position: absolute;
    top: 34px;
    left: 50%;
    width: 390px;
    min-height: 122px;
    transform: translateX(-50%) rotate(-1deg);
    padding: 21px 31px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(rgba(74, 37, 15, .12), rgba(15, 7, 3, .18)), #6a3c1f;
    border: 6px solid #3b1d0d;
    border-radius: 8px;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.12), 0 8px 18px rgba(31,13,4,.52);
    z-index: 3;
  }

  .logo-board::before,
  .logo-board::after {
    content: "";
    position: absolute;
    top: -38px;
    width: 9px;
    height: 43px;
    border-radius: 5px;
    background: repeating-linear-gradient(90deg, #624326 0 2px, #b18a55 2px 4px);
  }

  .logo-board::before { left: 42px; transform: rotate(-8deg); }
  .logo-board::after { right: 42px; transform: rotate(8deg); }
  .logo-board img { width: 100%; display: block; filter: drop-shadow(0 2px 1px rgba(255,255,255,.32)); }

  .headline {
    position: absolute;
    top: 246px;
    left: 48px;
    width: 690px;
    transform: rotate(-1deg);
    z-index: 4;
  }

  .headline h1 {
    color: #b31217;
    font-family: "Rockwell Extra Bold", "Arial Black", Impact, sans-serif;
    font-size: 118px;
    font-weight: 900;
    line-height: .88;
    letter-spacing: -3px;
    text-transform: uppercase;
    -webkit-text-stroke: 5px #fff4dd;
    paint-order: stroke fill;
    text-shadow: 5px 6px 0 #18100b, 10px 12px 0 rgba(75, 35, 10, .34);
  }

  .headline .question {
    display: inline-block;
    margin-top: 18px;
    padding: 10px 18px 8px;
    color: #fff7e4;
    background: #17110d;
    border: 5px solid #fff4dd;
    box-shadow: 5px 7px 0 #9f1717;
    font-family: "Rockwell Extra Bold", Georgia, serif;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: .5px;
    text-transform: uppercase;
  }

  .date-star {
    position: absolute;
    top: 210px;
    right: 4px;
    width: 330px;
    height: 310px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff7dc;
    background: #b31217;
    clip-path: polygon(50% 0%, 61% 28%, 89% 15%, 77% 42%, 100% 55%, 70% 62%, 79% 94%, 52% 76%, 31% 100%, 27% 68%, 0 63%, 24% 45%, 7% 19%, 38% 30%);
    filter: drop-shadow(7px 9px 0 rgba(35,17,8,.62));
    transform: rotate(7deg);
    text-align: center;
    z-index: 5;
  }

  .date-star .small {
    width: 178px;
    font-family: "Arial Black", Arial, sans-serif;
    font-size: 15px;
    letter-spacing: .5px;
    line-height: 1.1;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .date-star .date {
    width: 220px;
    margin: 7px 0;
    font-family: "Rockwell Extra Bold", "Arial Black", serif;
    font-size: 32px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -1px;
    white-space: nowrap;
  }

  .product {
    position: absolute;
    top: 560px;
    left: 50%;
    width: 1100px;
    transform: translateX(-50%) rotate(-1deg);
    z-index: 6;
    filter: drop-shadow(0 22px 18px rgba(20, 9, 3, .45));
  }

  .product img {
    width: 100%;
    display: block;
  }

  .price-tag {
    position: absolute;
    top: 560px;
    left: 54px;
    width: 280px;
    padding: 14px 10px 18px;
    transform: rotate(-6deg);
    color: #fff8e6;
    background: #b31217;
    border: 5px solid #fff4dd;
    box-shadow: 6px 8px 0 #591011;
    text-align: center;
    z-index: 7;
  }

  .price-tag .name {
    display: block;
    margin-bottom: 7px;
    padding-bottom: 7px;
    border-bottom: 2px solid rgba(255,255,255,.4);
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .3px;
    text-transform: uppercase;
    line-height: 1.15;
  }

  .price-tag .from {
    display: block;
    color: #ffd9d9;
    font-size: 17px;
    font-weight: 700;
    text-decoration: line-through;
  }

  .price-tag .value {
    display: block;
    font-family: "Rockwell Extra Bold", "Arial Black", serif;
    font-size: 32px;
    font-weight: 900;
    line-height: .95;
  }

  .price-tag .value b {
    font-size: 62px;
  }

  .price-tag .terms {
    display: block;
    margin-top: 5px;
    font-size: 18px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .ribbon {
    position: absolute;
    left: 50%;
    bottom: 286px;
    width: 950px;
    transform: translateX(-50%) rotate(-1.2deg);
    padding: 18px 84px 17px;
    color: #fff8e6;
    background: #ad1519;
    border-top: 5px solid #53100d;
    border-bottom: 5px solid #53100d;
    box-shadow: 0 8px 14px rgba(49,20,6,.38);
    font-family: "Rockwell Extra Bold", "Arial Black", serif;
    font-size: 37px;
    font-weight: 900;
    line-height: 1.08;
    letter-spacing: .5px;
    text-align: center;
    text-transform: uppercase;
    z-index: 7;
  }

  .ribbon::before,
  .ribbon::after {
    content: "";
    position: absolute;
    top: 12px;
    width: 58px;
    height: 58px;
    background: #721013;
    z-index: -1;
  }

  .ribbon::before { left: -35px; clip-path: polygon(0 0, 100% 18%, 100% 82%, 0 100%, 31% 50%); }
  .ribbon::after { right: -35px; clip-path: polygon(100% 0, 0 18%, 0 82%, 100% 100%, 69% 50%); }

  .footer {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 266px;
    padding: 34px 44px;
    display: grid;
    grid-template-columns: 1.12fr .88fr;
    gap: 22px;
    align-items: center;
    color: #fff6df;
    background: linear-gradient(rgba(34,15,7,.10), rgba(34,15,7,.26)), #573019;
    border-top: 8px solid #2f180c;
    box-shadow: inset 0 4px 0 rgba(255,255,255,.10);
    z-index: 8;
  }

  .footer-copy .main {
    font-family: "Rockwell Extra Bold", Georgia, serif;
    font-size: 34px;
    font-weight: 900;
    line-height: 1.08;
    text-transform: uppercase;
  }

  .footer-copy .sub { margin-top: 11px; color: #ead3aa; font-size: 20px; font-weight: 700; }

  .phone-box {
    padding: 19px 18px;
    color: #fff8e6;
    background: #b31217;
    border: 5px solid #f7e8ca;
    box-shadow: 6px 7px 0 #20110a;
    text-align: center;
    transform: rotate(1deg);
  }

  .phone-box .call { display: block; margin-bottom: 5px; font-family: "Arial Black", Arial, sans-serif; font-size: 19px; text-transform: uppercase; }
  .phone-box .number { display: block; font-family: "Arial Black", Arial, sans-serif; font-size: 30px; font-weight: 900; }
</style>
</head>
<body>
  <div class="story">
    <div class="vignette"></div>

    <div class="logo-board">
      <img src="logo-oficial-white.png" alt="Colchões e Cia">
    </div>

    <div class="headline">
      <h1>Segura,<br>peão!</h1>
      <div class="question">Vai receber visita?</div>
    </div>

    <div class="date-star">
      <span class="small">Festa do Peão</span>
      <span class="date">20 a 30/08</span>
      <span class="small">Barretos</span>
    </div>

    <div class="product">
      <img src="produtos/produto-d33-light-casal.png" alt="Colchão D33 Light">
    </div>

    <div class="price-tag">
      <span class="name">Colchão D33 Light — Casal</span>
      <span class="value">R$<b>1.190</b></span>
      <span class="terms">em até 12x sem juros</span>
    </div>

    <div class="ribbon">Prepare o quarto antes da Festa</div>

    <div class="footer">
      <div class="footer-copy">
        <div class="main">Visita não dorme no improviso!</div>
        <div class="sub">Rua 20 esq. Av. 13 · Centro · Barretos</div>
      </div>
      <div class="phone-box">
        <span class="call">☎ Fale com um vendedor</span>
        <span class="number">(17) 3325-6039</span>
      </div>
    </div>
  </div>
</body>
</html>
